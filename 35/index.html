<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソーラーリターン 年運盤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap');
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#12162A 0%,#171C33 55%,#1A1F38 100%);color:#EAE6DB;font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;padding:28px 16px 56px;box-sizing:border-box}
.wrap{max-width:600px;margin:0 auto}
.display{font-family:'Shippori Mincho',serif}
.card{background:#1E2440;border:1px solid #2C3350;border-radius:14px;padding:18px 16px;margin-top:16px}
label{font-size:12px;color:#8D93AC;letter-spacing:.08em;display:block;margin-bottom:5px}
input,select{width:100%;box-sizing:border-box;background:#141930;border:1px solid #3A415C;border-radius:8px;color:#EAE6DB;padding:9px 11px;font-size:15px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:#D8B36A}
.row{display:flex;gap:10px;margin-top:12px}
h1{font-size:26px;font-weight:700;margin:10px 0 6px}
h2{font-size:16px;margin:0 0 10px;color:#D8B36A}
.btn{background:#D8B36A;color:#12162A;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
.copybtn{background:#D8B36A;color:#12162A;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.copybtn.done{background:#9CC79A}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2C3350;font-size:14px;gap:8px}
.sabian-text{font-size:11.5px;color:#8D93AC;line-height:1.6;padding:3px 0 6px;border-bottom:1px solid #2C3350}
pre{background:#141930;border:1px solid #3A415C;border-radius:10px;padding:14px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-all;margin:0;font-family:'SFMono-Regular',Menlo,Consolas,monospace;color:#CFD3E4}
.warn{color:#E08A7A}
.ok{color:#9CC79A}
.note{font-size:12px;color:#8D93AC;line-height:1.7;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header style="text-align:center;margin-bottom:4px">
    <div style="font-size:11px;letter-spacing:.35em;color:#D8B36A">&#10022; SOLAR RETURN CALCULATOR &#10022;</div>
    <h1 class="display">ソーラーリターン 年運盤</h1>
    <p style="font-size:13px;color:#8D93AC;margin:0;line-height:1.7">
      太陽が出生時の黄経に戻る精確な瞬間を算出し、<br>
      その瞬間のチャートとサビアン象意を出力します。<br>
      エンジンは出生図検算盤と同一（VSOP87D＋ΔT補正）。
    </p>
  </header>

  <section class="card">
    <h2 class="display">出生データ</h2>
    <label>お名前</label>
    <input id="name" placeholder="例）魚多沙汰">
    <div class="row">
      <div style="flex:2"><label>生年月日</label><input id="bdate" type="date" value="1990-04-15" min="1900-01-01" max="2050-12-31"></div>
      <div style="flex:1"><label>出生時刻</label><input id="btime" type="time" value="09:30"></div>
      <div style="width:90px"><label>時差(UTC)</label><input id="btz" type="number" step="0.5" value="9"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div style="flex:1"><label>出生地（都市）</label><select id="bcity"></select></div>
    </div>
    <div class="row" id="bcustomRow" style="display:none">
      <div style="flex:1"><label>北緯（度）</label><input id="blat" type="number" step="0.01" value="35.68"></div>
      <div style="flex:1"><label>東経（度）</label><input id="blon" type="number" step="0.01" value="139.69"></div>
    </div>
  </section>

  <section class="card">
    <h2 class="display">ソーラーリターン設定</h2>
    <div class="row" style="margin-top:0">
      <div style="width:120px"><label>対象年</label><input id="sryear" type="number" min="1900" max="2050" value="2026"></div>
      <div style="flex:1"><label>SR時の滞在地</label><select id="srcity"></select></div>
    </div>
    <div class="row" id="srcustomRow" style="display:none">
      <div style="flex:1"><label>北緯（度）</label><input id="srlat" type="number" step="0.01" value="35.68"></div>
      <div style="flex:1"><label>東経（度）</label><input id="srlon" type="number" step="0.01" value="139.69"></div>
    </div>
    <p class="note">※SR時の滞在地はハウス・ASC・MCに影響します。太陽が出生黄経に戻る瞬間（SR精確時刻）は場所によらず世界共通です。</p>
    <button class="btn" id="calcBtn">年運を算出する</button>
  </section>

  <section class="card" id="errCard" style="display:none">
    <span class="warn" id="errMsg"></span>
  </section>

  <section class="card" id="srInfoCard" style="display:none">
    <h2 class="display">SR情報</h2>
    <div id="srInfoBody"></div>
  </section>

  <section class="card" id="tableCard" style="display:none">
    <h2 class="display">SR天体配置 ＋ サビアン象意</h2>
    <div id="tableBody"></div>
  </section>

  <section class="card" id="blockCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 class="display">時期読みブロック（コピー用）</h2>
      <button id="copyBtn" class="copybtn">コピー</button>
    </div>
    <pre id="blockPre"></pre>
    <p class="note">命令書の【時期読みブロック】欄にそのまま貼り付けて使えます。</p>
  </section>
</div>

function vsopSum(series,tau){
  let v=0;
  for(const k of Object.keys(series)){let s=0;for(const t of series[k])s+=t[0]*Math.cos(t[1]+t[2]*tau);v+=s*Math.pow(tau,+k);}
  return v;
}
function helioRect(p,tau){
  const L=vsopSum(VSOP_TBL[p].L,tau),B=vsopSum(VSOP_TBL[p].B,tau),R=vsopSum(VSOP_TBL[p].R,tau);
  return[R*Math.cos(B)*Math.cos(L),R*Math.cos(B)*Math.sin(L),R*Math.sin(B),L,B,R];
}
function planetLonJD(p,jd){
  const tau=(jd-2451545)/365250,T=(jd-2451545)/36525;
  const e=helioRect("earth",tau);
  let pl=helioRect(p,tau);
  let dx=pl[0]-e[0],dy=pl[1]-e[1],dz=pl[2]-e[2];
  const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  pl=helioRect(p,tau-dist*0.0057755183/365250);
  dx=pl[0]-e[0];dy=pl[1]-e[1];
  let lam=Math.atan2(dy,dx)*R2D;
  const sunL=norm(e[3]*R2D+180);
  lam-=0.0057004*Math.cos((sunL-lam)*D2R);
  return norm(lam+nutationLon(T));
}
function sunLonJD(jd){
  const tau=(jd-2451545)/365250,T=(jd-2451545)/36525;
  const e=helioRect("earth",tau);
  return norm(e[3]*R2D+180+nutationLon(T)-0.005692/e[5]);
}

function moonLonJD(jd){
  const T=(jd-2451545)/36525;
  const Lp=norm(horner(T,218.3164477,481267.88123421,-0.0015786,1/538841,-1/65194000));
  const D=norm(horner(T,297.8501921,445267.1114034,-0.0018819,1/545868,-1/113065000));
  const M=norm(horner(T,357.5291092,35999.0502909,-0.0001536,1/24490000));
  const Mp=norm(horner(T,134.9633964,477198.8675055,0.0087414,1/69699,-1/14712000));
  const F=norm(horner(T,93.272095,483202.0175233,-0.0036539,-1/3526000,1/863310000));
  const E=horner(T,1,-0.002516,-0.0000074);
  let s=0;
  for(const t of MOON_TERMS){
    let coef=t[4];
    if(Math.abs(t[1])===1)coef*=E;else if(Math.abs(t[1])===2)coef*=E*E;
    s+=coef*Math.sin((t[0]*D+t[1]*M+t[2]*Mp+t[3]*F)*D2R);
  }
  const A1=norm(119.75+131.849*T),A2=norm(53.09+479264.290*T);
  s+=3958*Math.sin(A1*D2R)+1962*Math.sin((Lp-F)*D2R)+318*Math.sin(A2*D2R);
  return norm(Lp+s/1e6+nutationLon(T));
}

function gmst(jd){
  const T=(jd-2451545)/36525;
  return norm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000);
}
const eclFromRA=(ra,eps)=>norm(Math.atan2(Math.sin(ra*D2R),Math.cos(ra*D2R)*Math.cos(eps*D2R))*R2D);
function ascMc(jd,lat,lon){
  const T=(jd-2451545)/36525,eps=obliquity(T);
  const ramc=norm(gmst(jd)+lon);
  const mc=eclFromRA(ramc,eps);
  let asc=norm(Math.atan2(-Math.cos(ramc*D2R),Math.sin(ramc*D2R)*Math.cos(eps*D2R)+Math.tan(lat*D2R)*Math.sin(eps*D2R))*R2D);
  if(norm(asc-mc)>=180)asc=norm(asc+180);
  return{ramc,eps,mc,asc};
}
function placidusCusp(ramc,eps,lat,offset,frac,nocturnal){
  let ra=norm(ramc+offset);
  for(let i=0;i<60;i++){
    const lam=eclFromRA(ra,eps);
    const dec=Math.asin(Math.sin(lam*D2R)*Math.sin(eps*D2R))*R2D;
    const s=Math.tan(dec*D2R)*Math.tan(lat*D2R);
    if(Math.abs(s)>=1)return null;
    const ad=Math.asin(s)*R2D;
    const next=nocturnal?norm(ramc+180-frac*(90-ad)):norm(ramc+frac*(90+ad));
    if(Math.abs(norm(next-ra+180)-180)<1e-7){ra=next;break;}
    ra=next;
  }
  return eclFromRA(ra,eps);
}
function computeHouses(jd,lat,lon){
  const{ramc,eps,mc,asc}=ascMc(jd,lat,lon);
  const c=new Array(13).fill(null);
  c[10]=mc;c[1]=asc;
  c[11]=placidusCusp(ramc,eps,lat,30,1/3,false);
  c[12]=placidusCusp(ramc,eps,lat,60,2/3,false);
  c[2]=placidusCusp(ramc,eps,lat,120,2/3,true);
  c[3]=placidusCusp(ramc,eps,lat,150,1/3,true);
  if([c[11],c[12],c[2],c[3]].some(v=>v===null))return{cusps:null,mc,asc};
  c[4]=norm(mc+180);c[5]=norm(c[11]+180);c[6]=norm(c[12]+180);
  c[7]=norm(asc+180);c[8]=norm(c[2]+180);c[9]=norm(c[3]+180);
  return{cusps:c,mc,asc};
}
function houseOf(lonP,cusps){
  for(let h=1;h<=12;h++){
    const a=cusps[h],b=cusps[h%12+1];
    if(norm(lonP-a)<norm(b-a))return h;
  }
  return 12;
}

function angDiff(a,b){return norm(a-b+180)-180;}
function findSolarReturn(natalSunLon,year,natalMo,natalD,natalTz){
  const jdApprox=julianDay(year,natalMo,natalD,12-natalTz);
  let lo=jdApprox-3,hi=jdApprox+3;
  // ブラケット確認
  const dLo=angDiff(sunLonJD(lo+deltaTdays(lo)),natalSunLon);
  const dHi=angDiff(sunLonJD(hi+deltaTdays(hi)),natalSunLon);
  if(dLo*dHi>0){lo=jdApprox-6;hi=jdApprox+6;}
  // 二分法
  for(let i=0;i<80;i++){
    const mid=(lo+hi)/2;
    const d=angDiff(sunLonJD(mid+deltaTdays(mid)),natalSunLon);
    if(Math.abs(d)<1e-10)break;
    if(d<0)lo=mid;else hi=mid;
  }
  return(lo+hi)/2;
}

  "てんびん座":["標本にされた美しい蝶——美しさの固定と代償。完璧さと生命の緊張関係。","経験から生まれる新しい創造の種——過去が実を結ぶ瞬間。変容した遺産。","すべてが変わった新しい夜明け——全面的な転換の瞬間。不可逆的な変化。","キャンプファイアを囲む若者たちの霊的交流——火を中心にした精神的な絆。共同体の魂の活性。","内なる知識を伝える男性——直接的な智慧の伝達。内から外への流れ。","内的ビジョンの前に理想が具現化するのを見る男——想像が現実になる瞬間の目撃。","ニワトリを鷹から守りながら餌をやる女性——育む力と保護の同時実践。慈愛と警戒の共存。","荒れ果てた家の中で燃える暖炉——外の荒廃の中に残る温もり。内なる火の持続。","アートギャラリーの特別室に集まる三人の巨匠——卓越性の静かな存在。偉大な力の秘かな集会。","急流を抜けた後の静かな水域のカヌー——試練の後の平静。到達した安らぎ。","眼鏡越しに生徒を見つめる教授——観察による評価。知識の距離からの伝達。","山から出てくる炭坑夫——深部からの帰還。地下の労働の後の光。","シャボン玉を飛ばす子供たち——束の間の美しい球体。軽さと消えやすさ。","暑い昼間に昼寝する男——熱の中の休息。活動を休止する知恵。","環状の道——循環するルート。始まりと終わりのない旅。","嵐の後に修理のため立てかけられたボート——被害を受けた後の再建。回復の過程。","湾の船を眺める引退した船長——活動から距離を置いた観察。経験による静観。","逮捕された二人の男——行動の制約と結果。社会的な境界の執行。","隠れている泥棒集団——見えない脅威。欺瞞と潜伏。","任務を遂行するラビ——使命感に基づいた奉仕。宗教的な義務の実践。","日曜日のビーチを楽しむ群衆——集団的な休養。自然の中の社会的な解放。","噴水で鳥に水やりをする子供——無邪気な給水の行為。小さな慈愛の実践。","夜明けを告げるおんどりの声——転換点の宣言。新しい始まりの知らせ。","左側に三枚目の羽を持つ蝶——異常な形態の中の意味。規則を超えた変形。","秋の葉が示す生と死の謎——美しい消滅の中の啓示。季節の霊的な教え。","入れ替わる鷹と白い鳩——反対の性質の相互変換。対立の流動性。","澄んだ空高く飛ぶ飛行機——高い視点からの俯瞰。大気の透明な中での飛翔。","霊的な力の存在に気づく男性——見えない支援の認識。守護の意識化。","世代間の知識の橋渡しをする人類——時を超えた継承。世代をつなぐ智慧の連鎖。","哲学者の頭の三つのこぶ——知的能力の象徴的な外在化。思考の物質的な表れ。"],
  "さそり座":["混んだ観光バス——集団での移動と観光。共通体験の均一化。","割れて香りを放つ繊細な香水ビン——壊れることによる解放。脆さが生む豊かさ。","隣人が協力する棟上げ式——共同体の力による建設。助け合いの具体的な実践。","キャンドルを運ぶ若者——光を運ぶ奉仕。儀式の中の若い担い手。","巨大な岩場の海岸——力強い自然の境界。海と陸の壮大な接点。","故郷を離れさせるゴールドラッシュ——豊かさへの集団的な移動。根を断ち切る夢。","深海潜水夫——圧力の下への潜行。無意識の深部への探査。","静かな湖面に映る月明かり——反映する静けさ。感情の鏡としての水面。","仕事中の歯医者——痛みを伴う治癒。内部の問題への直接的な対処。","旧友を再び結ぶ親睦の夕食——過去のつながりの復活。時間を超えた絆の再確認。","救助される溺れた男性——危機からの救出。自力では不可能な時の援助。","大使館の公式舞踏会——国際的な社交の場。外交的な優雅さと権力。","実験室で実験する発明家——仮説の検証。創造的な探求の実践。","新しい回線をつなぐ電話接続士——コミュニケーションインフラの整備。接続の技術。","五つの砂山で遊ぶ子供たち——創造的な遊びの構造。子供が作り出す秩序。","突然笑い出した少女の顔——予期しない喜びの爆発。自然な感情の顕現。","偉大な子供を多く産んだ女性——精神的な創造力。魂のレベルでの多産性。","多彩に輝く森の中の道——光と影が織りなす美。自然の中の豊かな表現。","聞いた言葉を繰り返すオウム——理解なき反復。模倣と本質の乖離。","神聖な道の入口を閉じる暗いカーテン——秘義への閉鎖。試練の前の準備。","命令に良心で抵抗する軍人——道徳的な勇気。制度を超えた個人的判断。","野生の鴨を撃つハンター——自由なものを捕らえようとする意志。空からの収奪。","自然の精霊に変容するウサギ——形を超えた変身。物質から霊的なものへの移行。","山上の講話の後で帰路につく群衆——啓示の消化。高みからの降下と日常への帰還。","X線写真——表面を透過する視点。内部構造の可視化。","新しい場所に移動してテントを張るインディアン——適応的な移動。新領域への定着。","行進する軍楽隊——統率されたリズムの力。集団的な誇りと音楽。","領土に近づく妖精の王——見えない王国の力の接近。霊的な存在の境界への到来。","子供の命ごいをするインディアンの女性——命のための嘆願。母性による権威への訴え。","ハロウィン衣装で騒ぐ子供たち——変装という遊び。死の象徴化と安全な恐怖の体験。"],
  "いて座":["集まった退役軍人たち——共有された過去の記憶。戦友という深い絆。","波の白い帽子が示す風の力——見えない力の可視化。海面に現れる気流。","チェスをする二人の男——知的な対戦と戦略。思考の競い合い。","歩くことを学ぶ幼い子供——励ましの中での発達。基本的な能力の獲得。","大木に独り座る老いたフクロウ——蓄積された知恵の孤独な保有。夜の洞察力。","クリケットの試合——紳士的なルールの下での競争。伝統的なスポーツ精神。","人間の心の扉をノックするキューピッド——愛の到来の知らせ。開く可能性への問いかけ。","新元素が形成される地球の深部——根本的な創造。見えない変容の場。","一段ずつ子供を導く母親——段階的な指導。安全を確認しながらの成長支援。","金髪の女神の演技が現れるとき——理想が顕現する瞬間。神聖な美の表出。","古い寺院の人体形をしたランプ——身体に宿る光。神殿における生命の象徴。","鷲に変化する旗、そして雄鶏に変化する鷲——象徴の連続的変容。力の段階的な転換。","明るみに出る未亡人の過去——隠された歴史の暴露。過去が現在に介入する瞬間。","大ピラミッドとスフィンクス——時を超えた謎と壮大さ。人類の最高の建造と沈黙。","自分の影を探すグラウンドホッグ——自己の影を探す探求。直観による天候予測。","船の周りを飛ぶカモメ——機会を求める存在。物質的な恩恵への期待。","復活祭の夜明けの礼拝——再生の祝典。最も早い時間の霊的な集い。","日除け帽でビーチで遊ぶ子供——守られた遊び。夏の楽しみと保護の意識。","安全な土地へ移動するペリカン——本能的な保護の行動。子育てのための移住。","凍った池から夏用の氷を切り出す男たち——未来のための現在の労働。季節を超えた蓄え。","借りたメガネをかける子供と犬——他者の視点を借りること。見え方の相対性。","中国人の洗濯物——日常的な清潔の維持。文化的な丁寧さの習慣。","移民グループを迎える新しい国の入り口——受け入れる側の役割。新しい始まりの門。","コテージの入り口の青い鳥——幸福の小さな使者。家の入り口に現れる吉祥。","玩具の馬に乗る小太りの少年——想像の中の英雄。現実に制限された冒険心。","戦いの旗手——危険を冒して旗を持つ者。象徴を守る勇気。","仕事する彫刻家——物質から形を生み出す労働。創造的な変換の過程。","いまも使われる美しい流れの上の古い橋——時を超えて機能する架け橋。実用的な遺産。","郊外の家の芝を刈る太った少年——日常的な義務の遂行。若さと奉仕の素朴な場面。","支持者を祝福する法王——霊的権威の慈愛的行使。集まった者たちへの祝福の放射。"],
  "やぎ座":["部族に力を示すインディアンの酋長——集団における個人的権威の認識。力の象徴的な顕示。","戦争で損傷したバラの窓を持つゴシック教会——傷ついた美しさの継続。歴史を刻んだ建造物。","新しい経験を求めて現実を創る人間の魂——意識の創造的な力。体験への深い飢え。","大きなカヌーを準備する一行——集団的な旅の準備。出発前の整備と連携。","カヌーを漕ぐ者と踊る者のインディアンの出征——行動と儀式の並行。戦士と精神の両輪。","暗い森へのアーチ下に敷かれた丸太——暗い未知への備え。困難な道の土台作り。","ヴェールをかぶった予言者——隠された源から語る力。神の言葉の仲介者。","陽の当たる家で歌う鳥たち——幸福な環境の中の喜び。光と住環境が育む歌声。","ハープを運ぶ天使——天の音楽の使者。美しさを携えてやってくる存在。","手から餌をもらうアホウドリ——信頼関係の構築。遠く広い世界からの近接。","私有地の中のキジの大群——保護された豊かさ。囲われた空間の豊穣。","生命を図解する自然科学の講義——生命のメカニズムの解説。小さな理解の積み重ね。","炎の前で瞑想する崇拝者——根源的なエネルギーとの一致。炎を通じた真理との接触。","御影石に刻まれた古代の彫刻——記憶の石への刻み込み。文化的記憶の保存。","おもちゃでいっぱいの小児病棟——苦しみを和らげる遊び。病の中の子供への配慮。","体操着の子供たちであふれる校庭——身体的な発達の場。集団での活力の表現。","解放を見出した抑圧された女性——制約からの心理的解放。身体を通じた自由の発見。","イギリス艦隊のユニオンジャック——帝国の権威の象徴。力の旗の誇示。","食品の袋を運ぶ五歳の子供——小さな責任の遂行。自分の力への誇り。","見えない聖歌隊の歌声——隠された源からの音。見えないが感じられる霊性。","リレー競争——バトンを渡す協力。個人の力と集団の連携。","敗北を優雅に受け入れる将軍——高貴な敗退の姿勢。結果よりも品格。","二つの勇敢さの賞を受ける戦士——認められた勇気。公的な価値の確認。","修道院に入る女性——世俗からの引退。霊的な隔離の選択。","東洋の敷物でいっぱいの店——異文化の豊かさの集積。遠くからもたらされた美。","滝の霧の中で踊る水の精霊——自然の力の中に宿る霊。動的な美の中の存在。","山の神殿への急な階段を登る巡礼者——高みへの意志的な上昇。労苦を伴う霊的な道。","大きな養鶏場——大量の生産と管理。規模による豊かさの組織化。","お茶の葉を読む女性——日常の中に潜む秘密。形から意味を読み取る直観。","世界情勢を決める秘密会議——見えない権力の中枢。運命を決める隠れた場。"],

function getSabian(lon){
  const signIdx=Math.floor(norm(lon)/30);
  const degInSign=norm(lon)%30;
  const degree=Math.floor(degInSign)+1;
  const signName=SIGNS[signIdx];
  return{degree,label:`${signName}${degree}度`,text:SABIAN[signName][degree-1]};
}

/* ===== 計算メイン ===== */
$("calcBtn").addEventListener("click",()=>{
  const show=(id,on)=>$(id).style.display=on?"":"none";
  show("errCard",false);show("srInfoCard",false);show("tableCard",false);show("blockCard",false);

  // --- 出生データ取得 ---
  const bdm=/^(\d{4})-(\d{2})-(\d{2})$/.exec($("bdate").value);
  const btm=/^(\d{2}):(\d{2})$/.exec($("btime").value);
  if(!bdm||!btm){show("errCard",true);$("errMsg").textContent="出生年月日と出生時刻を入力してください。";return;}
  const by=+bdm[1],bmo=+bdm[2],bd=+bdm[3];
  if(by<1900||by>2050){show("errCard",true);$("errMsg").textContent="出生年は1900〜2050年の範囲で入力してください。";return;}
  const btz=+$("btz").value;
  const bhUT=+btm[1]+ +btm[2]/60-btz;
  const bJD=julianDay(by,bmo,bd,bhUT);

  // 出生地
  const bcv=$("bcity").value;
  const bLat=bcv==="custom"?+$("blat").value:CITIES[+bcv][1];
  const bLon=bcv==="custom"?+$("blon").value:CITIES[+bcv][2];
  const bPlace=bcv==="custom"?`北緯${bLat}度 東経${bLon}度`:CITIES[+bcv][0];

  // 出生太陽黄経
  const natalSunLon=sunLonJD(bJD+deltaTdays(bJD));

  // --- SR設定 ---
  const srYear=+$("sryear").value;
  if(srYear<1900||srYear>2050){show("errCard",true);$("errMsg").textContent="対象年は1900〜2050年の範囲で入力してください。";return;}
  const srcv=$("srcity").value;
  const srLat=srcv==="custom"?+$("srlat").value:CITIES[+srcv][1];
  const srLon=srcv==="custom"?+$("srlon").value:CITIES[+srcv][2];
  const srPlace=srcv==="custom"?`北緯${srLat}度 東経${srLon}度`:CITIES[+srcv][0];

  // --- SR瞬間算出 ---
  const srJD=findSolarReturn(natalSunLon,srYear,bmo,bd,btz);
  const srDT=jdToDatetimeUTC(srJD);
  const srUTCStr=fmtUTC(srDT);
  const srLocalStr=fmtLocal(srDT,btz);

  // --- SR チャート ---
  const srBodies=BODIES.map(pair=>({name:pair[0],lon:pair[1](srJD)}));
  const H=computeHouses(srJD,srLat,srLon);
  const srBodyWithHouse=srBodies.map(b=>({...b,house:H.cusps?houseOf(b.lon,H.cusps):null,sabian:getSabian(b.lon),retro:false}));
  // 逆行判定
  srBodyWithHouse.forEach(b=>{
    if(b.name==="太陽"||b.name==="月")return;
    const fn=BODIES.find(p=>p[0]===b.name)[1];
    const d=(norm(fn(srJD+0.25)-fn(srJD-0.25)+180)-180)*2;
    b.retro=d<0;
  });

  const ascSabian=getSabian(H.asc);
  const mcSabian=getSabian(H.mc);

  // --- SR情報表示 ---
  show("srInfoCard",true);
  $("srInfoBody").innerHTML=`
    <div class="line"><span>SR精確時刻（UTC）</span><span>${srUTCStr}</span></div>
    <div class="line"><span>日本時間（参考）</span><span>${srLocalStr}</span></div>
    <div class="line"><span>SR滞在地</span><span>${srPlace}</span></div>
    <div class="line"><span>出生太陽黄経</span><span>${signOf(natalSunLon)} ${fmtDeg(natalSunLon)}</span></div>
    <div class="line" style="border-bottom:none"><span>ハウス方式</span><span>プラシーダス</span></div>`;

  // --- 天体テーブル表示 ---
  show("tableCard",true);
  let t="";
  for(const b of srBodyWithHouse){
    const sb=b.sabian;
    t+=`<div class="line"><span>${GLYPHS[b.name]} ${b.name}</span><span style="text-align:right">${signOf(b.lon)} ${fmtDeg(b.lon)}${b.retro?"（逆行）":""}${b.house?` ／ 第${b.house}H`:""}</span></div>`;
    t+=`<div class="sabian-text">▷ [${sb.label}] ${sb.text}</div>`;
  }
  t+=`<div class="line"><span>ASC 上昇宮</span><span>${signOf(H.asc)} ${fmtDeg(H.asc)}</span></div>`;
  t+=`<div class="sabian-text">▷ [${ascSabian.label}] ${ascSabian.text}</div>`;
  t+=`<div class="line" style="border-bottom:none"><span>MC 天頂</span><span>${signOf(H.mc)} ${fmtDeg(H.mc)}</span></div>`;
  t+=`<div class="sabian-text" style="border-bottom:none">▷ [${mcSabian.label}] ${mcSabian.text}</div>`;
  $("tableBody").innerHTML=t;

  // --- ブロック生成 ---
  const name=$("name").value||"（お名前未入力）";
  const L=[];
  L.push("【ソーラーリターン年運ブロック】");
  L.push(`対象: ${name} 様`);
  L.push(`生年月日: ${$("bdate").value.replace(/-/g,"/")} ${$("btime").value}（UTC${btz>=0?"+":""}${btz}）`);
  L.push(`出生地: ${bPlace}`);
  L.push(`出生太陽: ${signOf(natalSunLon)} ${fmtDeg(natalSunLon)}`);
  L.push("");
  L.push(`◆ ${srYear}年 ソーラーリターン`);
  L.push(`SR精確時刻: ${srUTCStr}`);
  L.push(`　　　　　　（${srLocalStr}）`);
  L.push(`SR滞在地: ${srPlace}（北緯${srLat}度・東経${srLon}度）`);
  L.push("ハウス方式: プラシーダス");
  L.push("");
  L.push("◆ SR天体配置");
  for(const b of srBodyWithHouse){
    const sb=b.sabian;
    L.push(`${b.name}: ${signOf(b.lon)} ${fmtDeg(b.lon)}${b.retro?"（逆行）":""}${b.house?` ／ 第${b.house}ハウス`:""}`);
    L.push(`  ▷ [${sb.label}] ${sb.text}`);
  }
  L.push(`SR ASC: ${signOf(H.asc)} ${fmtDeg(H.asc)}`);
  L.push(`  ▷ [${ascSabian.label}] ${ascSabian.text}`);
  L.push(`SR MC: ${signOf(H.mc)} ${fmtDeg(H.mc)}`);
  L.push(`  ▷ [${mcSabian.label}] ${mcSabian.text}`);
  L.push("");
  L.push("算出: 出生図検算盤と同一エンジン（VSOP87D＋Meeus月理論＋ΔT補正）。");
  L.push("SR精確時刻は地球上どこにいても共通。ハウス・ASC・MCはSR滞在地に依存。");

  show("blockCard",true);
  $("blockPre").textContent=L.join("\n");
});

$("copyBtn").addEventListener("click",async()=>{
  const text=$("blockPre").textContent;
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}
  $("copyBtn").textContent="コピーしました";$("copyBtn").classList.add("done");
  setTimeout(()=>{$("copyBtn").textContent="コピー";$("copyBtn").classList.remove("done");},1600);
});
</script>
</body>
